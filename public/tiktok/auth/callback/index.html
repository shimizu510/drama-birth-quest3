<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikTok Callback | DraMap</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe5;
        --panel: rgba(255, 255, 255, 0.92);
        --text: #1d2733;
        --muted: #5d6775;
        --line: rgba(29, 39, 51, 0.12);
        --accent: #d35c2d;
        --accent-strong: #8e3413;
        --shadow: 0 24px 60px rgba(65, 41, 10, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(211, 92, 45, 0.16), transparent 24%),
          linear-gradient(180deg, #efe7d8 0%, var(--bg) 46%, #f8f6f1 100%);
      }

      main {
        width: min(680px, 100%);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .eyebrow {
        margin-bottom: 10px;
        color: var(--accent-strong);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      a {
        display: inline-flex;
        margin-top: 20px;
        padding: 12px 18px;
        border-radius: 999px;
        color: #fff;
        background: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">TikTok Callback</p>
      <h1 id="callback-status">Callback Ready</h1>
      <p>
        Returning to DraMap to finish TikTok authentication…
      </p>
      <a id="open-dramap-link" href="adventure3d2://tiktok/auth/callback" style="display:none;">
        Open DraMap
      </a>
    </main>
    <script>
      (() => {
        const target = new URL("adventure3d2://tiktok/auth/callback");
        const incoming = new URL(window.location.href);
        incoming.searchParams.forEach((value, key) => {
          target.searchParams.append(key, value);
        });
        const targetURL = target.toString();
        const status = document.getElementById("callback-status");
        if (status) {
          status.textContent = "Returning to DraMap...";
        }

        window.location.href = targetURL;

        setTimeout(() => {
          const manualLink = document.getElementById("open-dramap-link");
          if (manualLink) {
            manualLink.href = targetURL;
            manualLink.style.display = "inline-flex";
          }
        }, 1200);
      })();
    </script>
  </body>
</html>
